name: Build and Deploy

on:
  push:
    branches: [Main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/palletes:latest ./mymarket

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/palletes:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/palletes:latest
            docker stop mymarket-app || true
            docker rm mymarket-app || true
            docker run -d -p 3000:3000 --name mymarket-app ${{ secrets.DOCKERHUB_USERNAME }}/palletes:latest
