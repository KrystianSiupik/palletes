receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: # grupuje i wysyła paczkami – zmniejsza obciążenie
    timeout: 1s
    send_batch_size: 1000

exporters:
  otlp/tempo:
    endpoint: tempo:4317 # nazwa serwisu + wewnętrzny port Tempo (gRPC)
    tls:
      insecure: true # lokalnie bez TLS

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
